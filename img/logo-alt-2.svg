<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280">
  <defs>
    <style>
      .text-serif { font-family: 'Georgia', 'Times New Roman', serif; font-weight: 700; }
      .text-sans { font-family: 'Helvetica', 'Arial', sans-serif; font-weight: 400; }
      .text-italic { font-family: 'Georgia', serif; font-style: italic; font-weight: 400; }
    </style>
  </defs>

  <!-- Left decorative element -->
  <g transform="translate(140, 140)">
    <!-- Wheat stem on left -->
    <g stroke="#b8943e" stroke-width="2" stroke-linecap="round" fill="none">
      <line x1="0" y1="60" x2="0" y2="-50"/>
      <!-- Wheat grains -->
      <ellipse cx="-7" cy="-40" rx="3.5" ry="7" fill="#b8943e" stroke="none"/>
      <ellipse cx="7" cy="-40" rx="3.5" ry="7" fill="#b8943e" stroke="none"/>
      <ellipse cx="-7" cy="-25" rx="3.5" ry="7" fill="#b8943e" stroke="none"/>
      <ellipse cx="7" cy="-25" rx="3.5" ry="7" fill="#b8943e" stroke="none"/>
      <ellipse cx="-7" cy="-10" rx="3.5" ry="7" fill="#b8943e" stroke="none"/>
      <ellipse cx="7" cy="-10" rx="3.5" ry="7" fill="#b8943e" stroke="none"/>
      <ellipse cx="0" cy="-50" rx="3" ry="6" fill="#b8943e" stroke="none"/>
    </g>
  </g>

  <!-- Mirror wheat right -->
  <g transform="translate(660, 140)">
    <g stroke="#b8943e" stroke-width="2" stroke-linecap="round" fill="none">
      <line x1="0" y1="60" x2="0" y2="-50"/>
      <ellipse cx="-7" cy="-40" rx="3.5" ry="7" fill="#b8943e" stroke="none"/>
      <ellipse cx="7" cy="-40" rx="3.5" ry="7" fill="#b8943e" stroke="none"/>
      <ellipse cx="-7" cy="-25" rx="3.5" ry="7" fill="#b8943e" stroke="none"/>
      <ellipse cx="7" cy="-25" rx="3.5" ry="7" fill="#b8943e" stroke="none"/>
      <ellipse cx="-7" cy="-10" rx="3.5" ry="7" fill="#b8943e" stroke="none"/>
      <ellipse cx="7" cy="-10" rx="3.5" ry="7" fill="#b8943e" stroke="none"/>
      <ellipse cx="0" cy="-50" rx="3" ry="6" fill="#b8943e" stroke="none"/>
    </g>
  </g>

  <!-- Top thin line -->
  <line x1="200" y1="80" x2="600" y2="80" stroke="#1a3c28" stroke-width="0.8"/>
  <line x1="200" y1="84" x2="600" y2="84" stroke="#b8943e" stroke-width="0.8"/>

  <!-- Main brand name -->
  <text x="400" y="158" text-anchor="middle" class="text-serif" font-size="64" fill="#1a3c28" letter-spacing="4">GRASS·DAN</text>

  <!-- Subtitle italic -->
  <text x="400" y="192" text-anchor="middle" class="text-italic" font-size="22" fill="#b8943e">Daniel Grycman</text>

  <!-- Bottom small caps -->
  <text x="400" y="222" text-anchor="middle" class="text-sans" font-size="11" fill="#4a4a4a" letter-spacing="6">USŁUGI · TERENOWE</text>

  <!-- Bottom thin line -->
  <line x1="320" y1="238" x2="480" y2="238" stroke="#b8943e" stroke-width="0.8"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="700" height="240">
  <defs>
    <style>
      .g-dark { fill: #1a3c28; }
      .g-main { fill: #2d6a3f; }
      .gold { fill: #b8943e; }
      .white { fill: #ffffff; }
      .text-bold { font-family: 'Arial Black', 'Helvetica', sans-serif; font-weight: 900; }
      .text-thin { font-family: 'Arial', 'Helvetica', sans-serif; font-weight: 400; }
    </style>
  </defs>

  <!-- Circular badge on left -->
  <g transform="translate(110, 120)">
    <circle cx="0" cy="0" r="90" fill="#1a3c28"/>
    <circle cx="0" cy="0" r="82" fill="none" stroke="#b8943e" stroke-width="1.5"/>

    <!-- GD monogram -->
    <text x="0" y="22" text-anchor="middle" class="white text-bold" font-size="80" letter-spacing="-3">GD</text>

    <!-- Leaf accent left -->
    <path d="M -70,-35 Q -82,-18 -68,0 Q -58,-15 -60,-30 Z" fill="#3d8b53"/>

    <!-- Snowflake accent right -->
    <g transform="translate(65, -38)" stroke="#b8943e" stroke-width="2" fill="none" stroke-linecap="round">
      <line x1="0" y1="-10" x2="0" y2="10"/>
      <line x1="-10" y1="0" x2="10" y2="0"/>
      <line x1="-7" y1="-7" x2="7" y2="7"/>
      <line x1="-7" y1="7" x2="7" y2="-7"/>
    </g>

    <!-- Bottom curve decoration -->
    <path d="M -48,58 Q 0,78 48,58" stroke="#b8943e" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Right text block -->
  <text x="230" y="105" class="g-dark text-bold" font-size="56" letter-spacing="1">GRASS-DAN</text>
  <text x="230" y="140" class="gold text-thin" font-size="22" letter-spacing="4" font-style="italic">Daniel Grycman</text>

  <line x1="230" y1="160" x2="450" y2="160" stroke="#b8943e" stroke-width="1"/>
  <text x="230" y="185" class="g-main text-thin" font-size="13" letter-spacing="3" opacity="0.7">PIELĘGNACJA · WYCINKA · ODŚNIEŻANIE</text>
  <text x="230" y="205" class="g-main text-thin" font-size="13" letter-spacing="3" opacity="0.7">TRANSPORT DREWNA · KARCZOWANIE</text>
</svg>

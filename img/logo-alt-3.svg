<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320">
  <defs>
    <style>
      .text-bold { font-family: 'Arial Black', 'Helvetica Neue', sans-serif; font-weight: 900; }
      .text-thin { font-family: 'Arial', 'Helvetica', sans-serif; font-weight: 500; }
      .text-serif { font-family: 'Georgia', serif; font-weight: 700; }
    </style>
  </defs>

  <!-- Circular badge -->
  <g transform="translate(160, 160)">
    <!-- Outer ring shadow -->
    <circle cx="2" cy="3" r="118" fill="#000" opacity="0.08"/>

    <!-- Main outer circle -->
    <circle cx="0" cy="0" r="120" fill="#1a3c28"/>

    <!-- Gold ring -->
    <circle cx="0" cy="0" r="108" fill="none" stroke="#b8943e" stroke-width="2"/>

    <!-- Inner background -->
    <circle cx="0" cy="0" r="102" fill="#2d6a3f"/>

    <!-- "GRASS-DAN" arch top text -->
    <path id="topArc" d="M -85,-15 A 85,85 0 0 1 85,-15" fill="none"/>
    <text font-size="16" fill="#b8943e" letter-spacing="4" class="text-bold">
      <textPath href="#topArc" startOffset="50%" text-anchor="middle">GRASS-DAN</textPath>
    </text>

    <!-- Center GD monogram -->
    <text x="0" y="22" text-anchor="middle" class="text-bold" font-size="80" fill="#ffffff" letter-spacing="-3">GD</text>

    <!-- Decorative dots -->
    <circle cx="-65" cy="0" r="3" fill="#b8943e"/>
    <circle cx="65" cy="0" r="3" fill="#b8943e"/>

    <!-- "EST. 2016" bottom -->
    <path id="bottomArc" d="M -85,30 A 85,85 0 0 0 85,30" fill="none"/>
    <text font-size="14" fill="#b8943e" letter-spacing="5" class="text-thin">
      <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">EST. 2016</textPath>
    </text>

    <!-- Wheat decorations on sides -->
    <g transform="translate(-95, 60)" stroke="#b8943e" stroke-width="1.5" fill="none">
      <line x1="0" y1="0" x2="-10" y2="-15"/>
      <ellipse cx="-4" cy="-4" rx="2" ry="4" fill="#b8943e" stroke="none" transform="rotate(-30 -4 -4)"/>
      <ellipse cx="-7" cy="-9" rx="2" ry="4" fill="#b8943e" stroke="none" transform="rotate(-30 -7 -9)"/>
    </g>
    <g transform="translate(95, 60)" stroke="#b8943e" stroke-width="1.5" fill="none">
      <line x1="0" y1="0" x2="10" y2="-15"/>
      <ellipse cx="4" cy="-4" rx="2" ry="4" fill="#b8943e" stroke="none" transform="rotate(30 4 -4)"/>
      <ellipse cx="7" cy="-9" rx="2" ry="4" fill="#b8943e" stroke="none" transform="rotate(30 7 -9)"/>
    </g>
  </g>

  <!-- Right text block -->
  <g transform="translate(320, 0)">
    <text x="0" y="135" class="text-serif" font-size="58" fill="#1a3c28" letter-spacing="2">GRASS-DAN</text>
    <line x1="0" y1="152" x2="380" y2="152" stroke="#b8943e" stroke-width="1.5"/>
    <text x="0" y="180" class="text-thin" font-size="18" fill="#b8943e" letter-spacing="5">DANIEL GRYCMAN</text>

    <!-- Tagline with bullet points -->
    <g transform="translate(0, 215)" font-size="13" fill="#4a4a4a" letter-spacing="1.5" opacity="0.8" class="text-thin">
      <text x="0" y="0">Usługi terenowe</text>
      <circle cx="120" cy="-4" r="1.5" fill="#b8943e"/>
      <text x="130" y="0">Wycinka drzew</text>
      <circle cx="240" cy="-4" r="1.5" fill="#b8943e"/>
      <text x="250" y="0">Odśnieżanie</text>
    </g>
  </g>
</svg>

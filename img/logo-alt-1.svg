<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280">
  <defs>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d6a3f"/>
      <stop offset="100%" stop-color="#1a3c28"/>
    </linearGradient>
    <style>
      .text-heavy { font-family: 'Arial Black', 'Helvetica Neue', sans-serif; font-weight: 900; }
      .text-medium { font-family: 'Arial', 'Helvetica', sans-serif; font-weight: 600; }
    </style>
  </defs>

  <!-- Hexagonal shield emblem -->
  <g transform="translate(140, 140)">
    <!-- Shadow / depth -->
    <path d="M 4,-76 L 70,-39 L 70,39 L 4,76 L -62,39 L -62,-39 Z" fill="#000" opacity="0.08"/>
    <!-- Main hex -->
    <path d="M 0,-80 L 70,-40 L 70,40 L 0,80 L -70,40 L -70,-40 Z" fill="url(#hexGrad)"/>
    <!-- Inner border -->
    <path d="M 0,-68 L 60,-34 L 60,34 L 0,68 L -60,34 L -60,-34 Z" fill="none" stroke="#b8943e" stroke-width="2"/>

    <!-- GD monogram -->
    <text x="0" y="18" text-anchor="middle" class="text-heavy" font-size="62" fill="#ffffff" letter-spacing="-2">GD</text>

    <!-- Top accent -->
    <line x1="-20" y1="-50" x2="20" y2="-50" stroke="#b8943e" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Bottom accent -->
    <line x1="-20" y1="50" x2="20" y2="50" stroke="#b8943e" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Brand text -->
  <g transform="translate(280, 0)">
    <!-- Top gold accent bar -->
    <rect x="0" y="78" width="60" height="4" fill="#b8943e"/>

    <text x="0" y="138" class="text-heavy" font-size="62" fill="#1a3c28" letter-spacing="0">GRASS-DAN</text>

    <!-- Underline divider -->
    <line x1="0" y1="155" x2="400" y2="155" stroke="#e0d9c4" stroke-width="1"/>

    <text x="0" y="182" class="text-medium" font-size="18" fill="#b8943e" letter-spacing="4">DANIEL GRYCMAN</text>

    <text x="0" y="215" class="text-medium" font-size="12" fill="#4a4a4a" letter-spacing="3" opacity="0.7">USŁUGI TERENOWE · EST. 2016</text>
  </g>
</svg>
